services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: elixir:1.18-alpine
    working_dir: /app
    command: sh -c "mix local.hex --force && mix local.rebar --force && mix deps.get && mix ecto.setup && mix phx.server"
    environment:
      DB_HOST: db
      MIX_ENV: dev
    ports:
      - "4000:4000"
    volumes:
      - ./api:/app
      - api_deps:/app/deps
      - api_build:/app/_build
      - mix_home:/root/.mix
      - hex_cache:/root/.hex
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  api_deps:
  api_build:
  mix_home:
  hex_cache:
